  int-api.base-url: https://localhost:8443
  hmpps-auth.base-url: http://hmpps-auth:8080
  adjudications.base-url: http://prism:4010
  assess-risks-and-needs.base-url: http://prism:4047
  case-notes.base-url: http://prism:4046
  create-and-vary-licence.base-url: http://prism:4045
  manage-pom-case-api.base-url: http://prism:4014
  ndelius.base-url: http://prism:4201
  prison-api.base-url: http://prism:4044
  prisoner-offender-search.base-url: http://prism:4017
  plp.base-url: http://prism:4020
  san.base-url: http://localhost:4200
  non-associations.base-url: http://prism:4043
  personal-relationships.base-url: http://localhost:4042
  manage-prison-visits.base-url: http://localhost:4041
  incentives.base-url: http://localhost:4040
  alerts.base-url: http://localhost:4039
  locations-inside-prison.base-url: http://localhost:4038
  health-and-medication.base-url: http://localhost:4027
  activities.base-url: http://localhost:4028
  integration-api.base-url: http://localhost:4029
  prisoner-base-location.base-url: http://localhost:4030
  core-person-record.base-url: http://localhost:4031
  probation-offender-search.base-url: http://localhost:4033
  manage-users.base-url: http://localhost:4034
  court-register.base-url: http://localhost:4035
  remand-and-sentencing.base-url: http://localhost:4036
  cemo.base-url: http://localhost:4037

authorisation:
  consumers:
    automated-test-client:
      roles:
        - "full-access"
      filters:
    config-v2-test:
      roles:
        - "hmpps-system"
      filters:
        prisons:
          - XYZ
    all-access:
      roles:
        - "full-access"
      filters:
  default-consumer-name: "all-access"

hmpps.sqs:
  provider: localstack
  localstackUrl: http://local-stack-aws:4566
  useWebToken: false
  queues:
    audit:
      queueName: "audit"
    visits:
      queueName: "visits"
    assessmentevents:
      queueName: "assessmentevents"
    locations:
      queueName: "locations"
    activities:
      queueName: "activities"
    educationstatusevents:
      queueName: "educationstatusevents"
      subscribeFilter: '{"eventType":["prison.education.updated"]}'
      subscribeTopicId: "domainevents"
    educationalnevents:
      queueName: "educationalnevents"
      subscribeFilter: '{"eventType":["prison.education-aln-assessment.updated"]}'
      subscribeTopicId: "domainevents"
    hmppsdomainqueue:
      queueName: hmpps_integrations_events_queue
      queueArn: arn:aws:sns:eu-west-2:000000000000:hmpps_integrations_events_queue
      dlqName: hmpps_integrations_events_queue_dlq
      subscribeTopicId: domainevents
  topics:
    domainevents:
      arn: arn:aws:sns:eu-west-2:000000000000:domainevents-topic
    integrationeventtopic:
      arn: arn:aws:sns:eu-west-2:000000000000:integration-event-topic
    emnotificationevents:
      arn: arn:aws:sns:eu-west-2:000000000000:returns-events.fifo

feature-flag:
  # API Config
  case-status-update-enabled: true
  course-completion-event-enabled: true
  use-active-alerts-endpoint: true
  use-contact-events-endpoint: true
  csra-endpoint: true
  use-emergency-contacts-endpoint: true
  epf-endpoint-includes-lao: true
  cpr-enabled: true
  use-assessment-summary-endpoint: true
  use-stubbed-assessment-summary: false
  contact-search-endpoint-enabled: true
  address-search-endpoint-enabled: true
  contact-linked-prisoners-endpoint-enabled: true
  prison-timeline-endpoint-enabled: true
  use-probation-search-for-person-search: false
  person-search-v2-enabled: true
  use-lao-enabled-by-default: true
  live-roll-enabled: true
  prison-role-check-enabled: true
  obo-caseload-filter-enabled: false
  # Events Config
  enable-delete-processed-events: false
  enable-publish-pending-events: false
  enable-domain-events-queue-listener: false
  person-languages-changed-notifications-enabled: true
  prisoner-base-location-changed-notifications-enabled: true
  prisoner-merge-notifications-enabled: true
  contact-events-notifications-enabled: true
  limited-access-notifications-enabled: true
  deduplicate-events: false
