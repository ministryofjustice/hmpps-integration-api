services:
  prism:
    build:
      context: .
      dockerfile: Dockerfile.prism
    container_name: prism
    healthcheck:
      test: 'curl -H "Authorization: Bearer abc" -f http://0.0.0.0:4010/reported-adjudications/hearings?hearingDate=1910-06-03'
    ports:
      - "4010:4010"

  local-stack-aws:
    image: localstack/localstack:3.0
    container_name: local-stack-aws
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sns,sqs
      - DEBUG=${DEBUG- }
      - DATA_DIR=${DATA_DIR- }
      - PORT_WEB_UI=${PORT_WEB_UI- }
      - LAMBDA_EXECUTOR=${LAMBDA_EXECUTOR- }
      - KINESIS_ERROR_PROBABILITY=${KINESIS_ERROR_PROBABILITY- }
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_EXECUTION_ENV=True
      - DEFAULT_REGION=eu-west-2
    volumes:
      - "./localstack:/var/lib/localstack"
      - "./localstack/init/ready.d:/etc/localstack/init/ready.d:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"

  postgres:
    image: postgres:15
    container_name: hmpps-integration-events-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: event_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - hmpps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d event_store -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  hmpps:
