# Automated management of Dependabot PRs
name: Dependabot
on: workflow_dispatch # Temp removal of pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: ministryofjustice/hmpps-probation-integration-services/.github/actions/dependabot-automerge@292d5ffcd08c71a81ee363f05a21d8ba5f0406a1 # main
        with:
          token: ${{ steps.app-token.outputs.token }}
